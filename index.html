<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepMaster PRO - Smart Meal Planning & Food Log</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0A0D14',
                        cardbg: 'rgba(18, 24, 38, 0.75)',
                        borderglass: 'rgba(255, 255, 255, 0.08)',
                        neonCyan: '#06B6D4',
                        neonGreen: '#00E676',
                        neonPurple: '#A855F7',
                        neonAmber: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #05070a;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel-glow {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* Custom scrollbar for clean mobile feel */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 13, 20, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 md:p-6 bg-slate-950 text-gray-100">

    <div id="root" class="w-full max-w-md h-[100vh] sm:h-[880px] flex flex-col relative overflow-hidden bg-[#0A0D14] sm:rounded-3xl border border-white/10 shadow-2xl shadow-cyan-950/40"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sample Data Initialization
        const INITIAL_MEALS = [
            {
                id: 'm1',
                title: 'Grilled Salmon Bowl',
                type: 'Lunch',
                time: '12:30 PM',
                photo: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80',
                foods: [
                    { name: 'Grilled Salmon', portion: '150g', confidence: 0.95 },
                    { name: 'Brown Rice', portion: '1 cup', confidence: 0.90 },
                    { name: 'Avocado', portion: '1/2 slice', confidence: 0.88 }
                ],
                caloriesEst: 540,
                notes: 'Delicious lunch, added extra sesame seeds.'
            },
            {
                id: 'm2',
                title: 'Greek Yogurt Parfait',
                type: 'Breakfast',
                time: '08:15 AM',
                photo: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=400&q=80',
                foods: [
                    { name: 'Greek Yogurt', portion: '200g', confidence: 0.98 },
                    { name: 'Blueberries', portion: '50g', confidence: 0.92 },
                    { name: 'Honey', portion: '1 tbsp', confidence: 0.70 }
                ],
                caloriesEst: 310,
                notes: 'Quick morning breakfast'
            }
        ];

        const INITIAL_PLAN = {
            Monday: { Breakfast: 'Greek Yogurt Parfait', Lunch: 'Grilled Salmon Bowl', Dinner: 'Turkey Quinoa Salad' },
            Tuesday: { Breakfast: 'Oatmeal & Banana', Lunch: 'Chicken Wrap', Dinner: 'Baked Cod with Asparagus' },
            Wednesday: { Breakfast: 'Protein Smoothie', Lunch: 'Turkey Quinoa Salad', Dinner: 'Tofu Veggie Stir Fry' },
            Thursday: { Breakfast: 'Avocado Toast', Lunch: 'Meal Prep Salmon', Dinner: 'Chicken Breast & Sweet Potato' },
            Friday: { Breakfast: 'Greek Yogurt Parfait', Lunch: 'Tofu Veggie Stir Fry', Dinner: 'Homemade Veggie Pizza' },
            Saturday: { Breakfast: 'Pancakes with Berries', Lunch: 'Out with Friends', Dinner: 'Grilled Steak Salad' },
            Sunday: { Breakfast: 'Scrambled Eggs', Lunch: 'Meal Prep Roast', Dinner: 'Lentil Soup' }
        };

        const INITIAL_GROCERIES = [
            { id: 'g1', item: 'Atlantic Salmon Filet', qty: '300g', category: 'Seafood & Meat', checked: false },
            { id: 'g2', item: 'Greek Yogurt (Plain 0%)', qty: '1 Tub', category: 'Dairy & Eggs', checked: true },
            { id: 'g3', item: 'Fresh Blueberries', qty: '1 Box', category: 'Produce', checked: false },
            { id: 'g4', item: 'Organic Avocados', qty: '3 units', category: 'Produce', checked: false },
            { id: 'g5', item: 'Quinoa Grain', qty: '500g Bag', category: 'Pantry', checked: false },
            { id: 'g6', item: 'Olive Oil', qty: '1 Bottle', category: 'Pantry', checked: true }
        ];

        function App() {
            // App state
            const [activeTab, setActiveTab] = useState('home');
            const [meals, setMeals] = useState(INITIAL_MEALS);
            const [weeklyPlan, setWeeklyPlan] = useState(INITIAL_PLAN);
            const [groceries, setGroceries] = useState(INITIAL_GROCERIES);
            const [showOnboarding, setShowOnboarding] = useState(true);
            const [dietaryPrefs, setDietaryPrefs] = useState({
                highProtein: true,
                keto: false,
                vegetarian: false,
                vegan: false,
                glutenFree: false,
                nutFree: true
            });

            // Scan Modal States
            const [isScanning, setIsScanning] = useState(false);
            const [scanImage, setScanImage] = useState(null);
            const [aiScanResult, setAiScanResult] = useState(null);
            const [showAddMealModal, setShowAddMealModal] = useState(false);
            const [manualMealData, setManualMealData] = useState({ title: '', type: 'Lunch', portion: '', calories: '' });

            // Initialize Lucide icons on render/tab change
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, isScanning, aiScanResult, showOnboarding]);

            // Save meal function
            const handleSaveScannedMeal = (verifiedMeal) => {
                setMeals([verifiedMeal, ...meals]);
                setAiScanResult(null);
                setScanImage(null);
                setActiveTab('home');
            };

            const handleAddManualMeal = (e) => {
                e.preventDefault();
                if (!manualMealData.title) return;
                const newMeal = {
                    id: 'm_' + Date.now(),
                    title: manualMealData.title,
                    type: manualMealData.type,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    photo: 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=400&q=80',
                    foods: [{ name: manualMealData.title, portion: manualMealData.portion || '1 portion', confidence: 1.0 }],
                    caloriesEst: parseInt(manualMealData.calories) || 400,
                    notes: 'Manually logged meal'
                };
                setMeals([newMeal, ...meals]);
                setShowAddMealModal(false);
                setManualMealData({ title: '', type: 'Lunch', portion: '', calories: '' });
            };

            const handleDeleteMeal = (id) => {
                setMeals(meals.filter(m => m.id !== id));
            };

            return (
                <div className="flex flex-col h-full w-full relative select-none">
                    {/* Header */}
                    <header className="flex justify-between items-center px-5 py-4 border-b border-white/10 glass-panel z-20">
                        <div className="flex items-center gap-2">
                            <span className="text-2xl animate-pulse">🔥</span>
                            <div>
                                <h1 className="font-extrabold text-lg tracking-wider text-white flex items-center gap-1.5">
                                    PrepMaster
                                    <span className="bg-gradient-to-r from-neonGreen to-emerald-400 text-slate-950 text-[10px] font-black px-1.5 py-0.5 rounded-full shadow-sm shadow-green-500/30">
                                        PRO
                                    </span>
                                </h1>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-xs text-gray-400 bg-white/5 border border-white/10 px-2 py-1 rounded-full flex items-center gap-1">
                                <span className="w-2 h-2 rounded-full bg-neonCyan inline-block animate-ping"></span>
                                MVP v1.0
                            </span>
                        </div>
                    </header>

                    {/* Main Scrollable Viewport */}
                    <main className="flex-1 overflow-y-auto px-4 py-5 space-y-6 pb-24">
                        {/* Medical / Estimation Banner */}
                        <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-200/90 text-xs flex gap-2.5 items-start">
                            <i data-lucide="info" className="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
                            <p>
                                <span className="font-semibold text-amber-300">Notice:</span> AI photo scan and food values are calculated estimates. Please verify ingredients for dietary safety.
                            </p>
                        </div>

                        {/* View Switcher based on Active Tab */}
                        {activeTab === 'home' && (
                            <HomeView 
                                meals={meals} 
                                weeklyPlan={weeklyPlan}
                                onScanClick={() => setActiveTab('scan')} 
                                onManualAdd={() => setShowAddMealModal(true)}
                                onPlanClick={() => setActiveTab('plan')}
                                onDeleteMeal={handleDeleteMeal}
                            />
                        )}

                        {activeTab === 'scan' && (
                            <ScanView 
                                scanImage={scanImage}
                                setScanImage={setScanImage}
                                isScanning={isScanning}
                                setIsScanning={setIsScanning}
                                aiScanResult={aiScanResult}
                                setAiScanResult={setAiScanResult}
                                onSaveMeal={handleSaveScannedMeal}
                            />
                        )}

                        {activeTab === 'plan' && (
                            <WeeklyPlanView 
                                weeklyPlan={weeklyPlan} 
                                setWeeklyPlan={setWeeklyPlan}
                                onSyncGroceries={(newItems) => {
                                    setGroceries([...groceries, ...newItems]);
                                    setActiveTab('groceries');
                                }}
                            />
                        )}

                        {activeTab === 'groceries' && (
                            <GroceriesView 
                                groceries={groceries} 
                                setGroceries={setGroceries} 
                            />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsView 
                                dietaryPrefs={dietaryPrefs} 
                                setDietaryPrefs={setDietaryPrefs} 
                                onShowOnboarding={() => setShowOnboarding(true)}
                            />
                        )}
                    </main>

                    {/* Bottom Sticky Tab Navigation */}
                    <nav className="absolute bottom-0 left-0 right-0 glass-panel border-t border-white/10 px-2 py-2 z-30 flex justify-around items-center">
                        <NavButton icon="home" label="Home" active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                        <NavButton icon="camera" label="Scan" active={activeTab === 'scan'} onClick={() => setActiveTab('scan')} isHighlight />
                        <NavButton icon="calendar" label="Plan" active={activeTab === 'plan'} onClick={() => setActiveTab('plan')} />
                        <NavButton icon="shopping-bag" label="Groceries" active={activeTab === 'groceries'} onClick={() => setActiveTab('groceries')} />
                        <NavButton icon="sliders" label="Settings" active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
                    </nav>

                    {/* Onboarding Overlay Modal */}
                    {showOnboarding && (
                        <OnboardingModal 
                            dietaryPrefs={dietaryPrefs} 
                            setDietaryPrefs={setDietaryPrefs} 
                            onClose={() => setShowOnboarding(false)} 
                        />
                    )}

                    {/* Manual Add Meal Modal */}
                    {showAddMealModal && (
                        <ManualAddMealModal 
                            data={manualMealData}
                            setData={setManualMealData}
                            onClose={() => setShowAddMealModal(false)}
                            onSubmit={handleAddManualMeal}
                        />
                    )}
                </div>
            );
        }

        // --- SUB-COMPONENTS --- //

        // Navigation Button
        function NavButton({ icon, label, active, onClick, isHighlight }) {
            return (
                <button 
                    onClick={onClick} 
                    className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all duration-200 ${
                        isHighlight 
                            ? 'bg-gradient-to-tr from-cyan-500 to-emerald-400 text-slate-950 font-bold -mt-4 shadow-lg shadow-cyan-500/30 p-2.5 rounded-full border-2 border-slate-900' 
                            : active 
                                ? 'text-neonCyan bg-white/5 font-semibold' 
                                : 'text-gray-400 hover:text-gray-200'
                    }`}
                >
                    <i data-lucide={icon} className={isHighlight ? "w-6 h-6" : "w-5 h-5 mb-0.5"}></i>
                    {!isHighlight && <span className="text-[10px] tracking-tight">{label}</span>}
                </button>
            );
        }

        // 1. HOME VIEW
        function HomeView({ meals, weeklyPlan, onScanClick, onManualAdd, onPlanClick, onDeleteMeal }) {
            return (
                <div className="space-y-5 animate-fadeIn">
                    {/* Welcome & Quick Action Bar */}
                    <div className="p-4 rounded-2xl glass-panel relative overflow-hidden">
                        <div className="absolute -right-6 -bottom-6 w-28 h-28 bg-neonCyan/10 rounded-full blur-2xl"></div>
                        <h2 className="text-lg font-bold text-white mb-1">Today's Meal Log</h2>
                        <p className="text-xs text-gray-400 mb-4">Easily plan your nutrition and track daily food intake.</p>
                        
                        <div className="grid grid-cols-3 gap-2">
                            <button 
                                onClick={onScanClick}
                                className="flex flex-col items-center justify-center p-3 rounded-xl bg-neonCyan/15 border border-neonCyan/30 text-neonCyan hover:bg-neonCyan/25 transition"
                            >
                                <i data-lucide="camera" className="w-5 h-5 mb-1"></i>
                                <span className="text-[11px] font-medium">Scan Meal</span>
                            </button>
                            <button 
                                onClick={onManualAdd}
                                className="flex flex-col items-center justify-center p-3 rounded-xl bg-white/5 border border-white/10 text-gray-200 hover:bg-white/10 transition"
                            >
                                <i data-lucide="plus-circle" className="w-5 h-5 mb-1 text-neonGreen"></i>
                                <span className="text-[11px] font-medium">Add Manual</span>
                            </button>
                            <button 
                                onClick={onPlanClick}
                                className="flex flex-col items-center justify-center p-3 rounded-xl bg-white/5 border border-white/10 text-gray-200 hover:bg-white/10 transition"
                            >
                                <i data-lucide="calendar" className="w-5 h-5 mb-1 text-neonPurple"></i>
                                <span className="text-[11px] font-medium">Plan Week</span>
                            </button>
                        </div>
                    </div>

                    {/* Today's Meals Timeline */}
                    <div>
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="text-sm font-bold text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="clock" className="w-4 h-4 text-neonGreen"></i>
                                Today's Saved Meals ({meals.length})
                            </h3>
                            <span className="text-xs text-gray-400">Est. Total: {meals.reduce((acc, m) => acc + (m.caloriesEst || 0), 0)} kcal</span>
                        </div>

                        {meals.length === 0 ? (
                            <div className="text-center py-8 glass-panel rounded-2xl border border-dashed border-white/10">
                                <i data-lucide="utensils" className="w-8 h-8 mx-auto text-gray-600 mb-2"></i>
                                <p className="text-sm text-gray-400">No meals logged today yet.</p>
                                <button onClick={onScanClick} className="mt-2 text-xs text-neonCyan underline">Scan a photo to start</button>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {meals.map((meal) => (
                                    <div key={meal.id} className="glass-panel p-3.5 rounded-2xl flex gap-3.5 items-center relative group">
                                        <img 
                                            src={meal.photo} 
                                            alt={meal.title} 
                                            className="w-20 h-20 rounded-xl object-cover border border-white/10 shrink-0 bg-slate-900" 
                                        />
                                        <div className="flex-1 min-w-0">
                                            <div className="flex justify-between items-start">
                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-neonCyan/20 text-neonCyan uppercase tracking-wider">
                                                    {meal.type}
                                                </span>
                                                <span className="text-[10px] text-gray-400">{meal.time}</span>
                                            </div>
                                            <h4 className="font-bold text-sm text-white truncate mt-1">{meal.title}</h4>
                                            
                                            <p className="text-xs text-gray-400 truncate mt-0.5">
                                                {meal.foods.map(f => `${f.name} (${f.portion})`).join(', ')}
                                            </p>

                                            <div className="flex justify-between items-center mt-2 pt-1 border-t border-white/5">
                                                <span className="text-xs text-emerald-400 font-semibold">~{meal.caloriesEst} kcal</span>
                                                <button 
                                                    onClick={() => onDeleteMeal(meal.id)}
                                                    className="text-gray-500 hover:text-red-400 transition text-xs p-1"
                                                    title="Delete meal"
                                                >
                                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Simple Weekly Plan Preview Widget */}
                    <div className="glass-panel p-4 rounded-2xl">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="text-sm font-bold text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="calendar-days" className="w-4 h-4 text-neonPurple"></i>
                                Today's Planned Menu
                            </h3>
                            <button onClick={onPlanClick} className="text-xs text-neonCyan hover:underline flex items-center gap-1">
                                View All <i data-lucide="chevron-right" className="w-3 h-3"></i>
                            </button>
                        </div>
                        <div className="grid grid-cols-3 gap-2 text-center">
                            <div className="p-2.5 rounded-xl bg-white/5 border border-white/5">
                                <span className="text-[10px] text-gray-400 uppercase font-semibold block mb-1">Breakfast</span>
                                <span className="text-xs text-gray-200 font-medium block truncate">{weeklyPlan.Monday.Breakfast}</span>
                            </div>
                            <div className="p-2.5 rounded-xl bg-white/5 border border-white/5">
                                <span className="text-[10px] text-gray-400 uppercase font-semibold block mb-1">Lunch</span>
                                <span className="text-xs text-gray-200 font-medium block truncate">{weeklyPlan.Monday.Lunch}</span>
                            </div>
                            <div className="p-2.5 rounded-xl bg-white/5 border border-white/5">
                                <span className="text-[10px] text-gray-400 uppercase font-semibold block mb-1">Dinner</span>
                                <span className="text-xs text-gray-200 font-medium block truncate">{weeklyPlan.Monday.Dinner}</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // 2. SCAN VIEW (AI Photo Scanner & Verification Modal)
        function ScanView({ scanImage, setScanImage, isScanning, setIsScanning, aiScanResult, setAiScanResult, onSaveMeal }) {
            
            // Handle image selection simulation
            const handleSimulatedCapture = (sampleType) => {
                let imgUrl = '';
                let mockResult = null;

                if (sampleType === 'bowl') {
                    imgUrl = 'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=500&q=80';
                    mockResult = {
                        title: 'Mediterranean Salad Bowl',
                        mealType: 'Lunch',
                        caloriesEst: 420,
                        foods: [
                            { id: 1, name: 'Feta Cheese', portion: '40g', confidence: 0.96, unsure: false },
                            { id: 2, name: 'Cherry Tomatoes', portion: '80g', confidence: 0.92, unsure: false },
                            { id: 3, name: 'Cucumbers', portion: '100g', confidence: 0.89, unsure: false },
                            { id: 4, name: 'Dressing (Olive oil base)', portion: '1.5 tbsp', confidence: 0.55, unsure: true }
                        ]
                    };
                } else {
                    imgUrl = 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=500&q=80';
                    mockResult = {
                        title: 'Pepperoni Pizza Slice',
                        mealType: 'Dinner',
                        caloriesEst: 380,
                        foods: [
                            { id: 1, name: 'Pizza Crust', portion: '1 slice (120g)', confidence: 0.98, unsure: false },
                            { id: 2, name: 'Pepperoni Slices', portion: '6 pieces', confidence: 0.91, unsure: false },
                            { id: 3, name: 'Mozzarella Cheese', portion: '50g', confidence: 0.62, unsure: true }
                        ]
                    };
                }

                setScanImage(imgUrl);
                setIsScanning(true);
                setAiScanResult(null);

                // Simulate AI Processing delay
                setTimeout(() => {
                    setIsScanning(false);
                    setAiScanResult(mockResult);
                }, 1800);
            };

            const updateFoodItem = (id, field, value) => {
                if (!aiScanResult) return;
                const updatedFoods = aiScanResult.foods.map(item => 
                    item.id === id ? { ...item, [field]: value } : item
                );
                setAiScanResult({ ...aiScanResult, foods: updatedFoods });
            };

            const toggleUnsure = (id) => {
                if (!aiScanResult) return;
                const updatedFoods = aiScanResult.foods.map(item => 
                    item.id === id ? { ...item, unsure: !item.unsure } : item
                );
                setAiScanResult({ ...aiScanResult, foods: updatedFoods });
            };

            return (
                <div className="space-y-5 animate-fadeIn">
                    <div className="text-center">
                        <h2 className="text-lg font-bold text-white">AI Vision Photo Scan</h2>
                        <p className="text-xs text-gray-400">Snap or select a food photo to detect meals & portion estimates</p>
                    </div>

                    {/* Camera / Photo Preview Area */}
                    {!scanImage ? (
                        <div className="border-2 border-dashed border-white/15 rounded-3xl p-8 text-center glass-panel flex flex-col items-center justify-center min-h-[260px]">
                            <div className="w-16 h-16 rounded-full bg-neonCyan/10 border border-neonCyan/30 flex items-center justify-center text-neonCyan mb-4 animate-bounce">
                                <i data-lucide="camera" className="w-8 h-8"></i>
                            </div>
                            <p className="text-sm font-semibold text-gray-200 mb-1">Select a Photo to Scan</p>
                            <p className="text-xs text-gray-400 mb-6">Test with sample images below:</p>

                            <div className="flex gap-2 w-full">
                                <button 
                                    onClick={() => handleSimulatedCapture('bowl')}
                                    className="flex-1 py-2.5 px-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-xs font-medium text-cyan-300 transition"
                                >
                                    🥗 Healthy Bowl
                                </button>
                                <button 
                                    onClick={() => handleSimulatedCapture('pizza')}
                                    className="flex-1 py-2.5 px-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-xs font-medium text-amber-300 transition"
                                >
                                    🍕 Pizza Slice
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="relative rounded-3xl overflow-hidden border border-white/10 glass-panel">
                            <img src={scanImage} alt="Scanned Meal" className="w-full h-64 object-cover" />
                            
                            {/* Scanning overlay animation */}
                            {isScanning && (
                                <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center">
                                    <div className="w-12 h-12 border-4 border-neonCyan border-t-transparent rounded-full animate-spin mb-3"></div>
                                    <p className="text-sm font-bold text-neonCyan tracking-wide">AI Analyzing Photo...</p>
                                    <p className="text-xs text-gray-400 mt-1">Identifying food items & portion sizes</p>
                                </div>
                            )}

                            {!isScanning && (
                                <button 
                                    onClick={() => { setScanImage(null); setAiScanResult(null); }}
                                    className="absolute top-3 right-3 bg-black/60 backdrop-blur-md p-2 rounded-full text-white hover:bg-black"
                                >
                                    <i data-lucide="x" className="w-4 h-4"></i>
                                </button>
                            )}
                        </div>
                    )}

                    {/* AI Scan Review & Editing Modal Form */}
                    {aiScanResult && !isScanning && (
                        <div className="glass-panel-glow p-4 rounded-3xl space-y-4 animate-slideUp">
                            <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                <div>
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-neonGreen">AI Detection Complete</span>
                                    <h3 className="font-bold text-base text-white">Review & Correct Results</h3>
                                </div>
                                <span className="text-xs px-2.5 py-1 rounded-full bg-neonGreen/10 border border-neonGreen/30 text-neonGreen font-semibold">
                                    ~{aiScanResult.caloriesEst} kcal
                                </span>
                            </div>

                            <p className="text-xs text-amber-300/90 bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">
                                ⚠️ Please verify identified foods and portions before saving to your food log.
                            </p>

                            {/* Identified Food Items List */}
                            <div className="space-y-3">
                                <label className="text-xs font-semibold text-gray-300 uppercase tracking-wider">Identified Items:</label>
                                {aiScanResult.foods.map((food) => (
                                    <div key={food.id} className="p-3 rounded-xl bg-white/5 border border-white/10 space-y-2">
                                        <div className="flex items-center justify-between gap-2">
                                            <input 
                                                type="text" 
                                                value={food.name}
                                                onChange={(e) => updateFoodItem(food.id, 'name', e.target.value)}
                                                className="bg-transparent text-sm font-semibold text-white focus:outline-none border-b border-transparent focus:border-neonCyan flex-1"
                                            />
                                            {food.confidence < 0.7 && (
                                                <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold">
                                                    Low Confidence
                                                </span>
                                            )}
                                        </div>

                                        <div className="flex items-center justify-between gap-2 text-xs">
                                            <div className="flex items-center gap-1 text-gray-400">
                                                <span>Portion:</span>
                                                <input 
                                                    type="text" 
                                                    value={food.portion}
                                                    onChange={(e) => updateFoodItem(food.id, 'portion', e.target.value)}
                                                    className="bg-slate-900 px-2 py-1 rounded border border-white/10 text-gray-200 text-xs w-24 focus:outline-none focus:border-neonCyan"
                                                />
                                            </div>

                                            <button 
                                                onClick={() => toggleUnsure(food.id)}
                                                className={`text-[11px] px-2 py-1 rounded border transition ${
                                                    food.unsure 
                                                        ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' 
                                                        : 'bg-white/5 border-white/10 text-gray-400 hover:text-gray-200'
                                                }`}
                                            >
                                                {food.unsure ? '❓ Marked Unsure' : 'I\'m not sure'}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Save Actions */}
                            <div className="pt-2">
                                <button 
                                    onClick={() => onSaveMeal({
                                        id: 'm_' + Date.now(),
                                        title: aiScanResult.title,
                                        type: aiScanResult.mealType,
                                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                        photo: scanImage,
                                        foods: aiScanResult.foods,
                                        caloriesEst: aiScanResult.caloriesEst,
                                        notes: 'Scanned via AI Vision'
                                    })}
                                    className="w-full py-3 rounded-xl bg-gradient-to-r from-neonCyan to-emerald-400 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 hover:opacity-95 transition"
                                >
                                    Confirm & Save to Meal Log
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 3. WEEKLY PLAN VIEW
        function WeeklyPlanView({ weeklyPlan, setWeeklyPlan, onSyncGroceries }) {
            const [selectedDay, setSelectedDay] = useState('Monday');
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

            const handleUpdateMeal = (mealType, value) => {
                setWeeklyPlan({
                    ...weeklyPlan,
                    [selectedDay]: {
                        ...weeklyPlan[selectedDay],
                        [mealType]: value
                    }
                });
            };

            const handleGenerateGroceryItems = () => {
                const generated = [
                    { id: 'g_' + Date.now() + '_1', item: 'Extra Virgin Olive Oil', qty: '1 bottle', category: 'Pantry', checked: false },
                    { id: 'g_' + Date.now() + '_2', item: 'Fresh Spinach', qty: '1 bag', category: 'Produce', checked: false },
                    { id: 'g_' + Date.now() + '_3', item: 'Chicken Breast', qty: '500g', category: 'Seafood & Meat', checked: false }
                ];
                onSyncGroceries(generated);
            };

            return (
                <div className="space-y-5 animate-fadeIn">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-lg font-bold text-white">Weekly Meal Plan</h2>
                            <p className="text-xs text-gray-400">Organize Breakfast, Lunch, and Dinner</p>
                        </div>
                        <button 
                            onClick={handleGenerateGroceryItems}
                            className="text-xs bg-neonPurple/20 border border-neonPurple/40 text-purple-300 font-semibold px-3 py-1.5 rounded-xl hover:bg-neonPurple/30 transition flex items-center gap-1"
                        >
                            <i data-lucide="shopping-cart" className="w-3.5 h-3.5"></i>
                            Sync to List
                        </button>
                    </div>

                    {/* Day Tabs Horizontal Selector */}
                    <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                        {days.map((day) => (
                            <button
                                key={day}
                                onClick={() => setSelectedDay(day)}
                                className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                                    selectedDay === day
                                        ? 'bg-neonCyan text-slate-950 shadow-md shadow-cyan-500/20'
                                        : 'glass-panel text-gray-400 hover:text-white'
                                }`}
                            >
                                {day.substring(0, 3)}
                            </button>
                        ))}
                    </div>

                    {/* Day Details Card */}
                    <div className="glass-panel p-4 rounded-3xl space-y-4">
                        <div className="border-b border-white/10 pb-2">
                            <h3 className="font-bold text-base text-white">{selectedDay}'s Schedule</h3>
                        </div>

                        <div className="space-y-3">
                            {['Breakfast', 'Lunch', 'Dinner'].map((mealType) => (
                                <div key={mealType} className="p-3 rounded-2xl bg-white/5 border border-white/10">
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="text-[11px] font-bold text-neonCyan uppercase tracking-wider">{mealType}</span>
                                    </div>
                                    <input 
                                        type="text" 
                                        value={weeklyPlan[selectedDay][mealType]} 
                                        onChange={(e) => handleUpdateMeal(mealType, e.target.value)}
                                        className="w-full bg-transparent text-sm font-medium text-white border-b border-white/10 focus:border-neonCyan focus:outline-none py-1"
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // 4. GROCERIES VIEW
        function GroceriesView({ groceries, setGroceries }) {
            const [newItem, setNewItem] = useState('');
            const [newCategory, setNewCategory] = useState('Produce');

            const toggleCheck = (id) => {
                setGroceries(groceries.map(g => g.id === id ? { ...g, checked: !g.checked } : g));
            };

            const addItem = (e) => {
                e.preventDefault();
                if (!newItem) return;
                setGroceries([
                    ...groceries,
                    { id: 'g_' + Date.now(), item: newItem, qty: '1 unit', category: newCategory, checked: false }
                ]);
                setNewItem('');
            };

            // Group by Category
            const categories = ['Produce', 'Seafood & Meat', 'Dairy & Eggs', 'Pantry'];

            return (
                <div className="space-y-5 animate-fadeIn">
                    <div>
                        <h2 className="text-lg font-bold text-white">Smart Grocery List</h2>
                        <p className="text-xs text-gray-400">Sorted automatically by supermarket aisle</p>
                    </div>

                    {/* Add Item Input */}
                    <form onSubmit={addItem} className="flex gap-2">
                        <input 
                            type="text" 
                            placeholder="Add item (e.g., Almond Milk)..."
                            value={newItem}
                            onChange={(e) => setNewItem(e.target.value)}
                            className="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-neonGreen"
                        />
                        <select 
                            value={newCategory} 
                            onChange={(e) => setNewCategory(e.target.value)}
                            className="bg-slate-900 border border-white/10 rounded-xl px-2 py-2 text-xs text-gray-300 focus:outline-none"
                        >
                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <button type="submit" className="bg-neonGreen text-slate-950 font-bold px-3 py-2 rounded-xl text-xs hover:opacity-90">
                            Add
                        </button>
                    </form>

                    {/* Grouped Aisle Categories */}
                    <div className="space-y-4">
                        {categories.map((cat) => {
                            const catItems = groceries.filter(g => g.category === cat);
                            if (catItems.length === 0) return null;

                            return (
                                <div key={cat} className="glass-panel p-3.5 rounded-2xl">
                                    <h3 className="text-xs font-bold text-neonGreen uppercase tracking-wider mb-2 flex items-center justify-between">
                                        <span>{cat}</span>
                                        <span className="text-[10px] text-gray-400 font-normal">{catItems.length} items</span>
                                    </h3>

                                    <div className="space-y-1.5">
                                        {catItems.map((g) => (
                                            <div 
                                                key={g.id} 
                                                onClick={() => toggleCheck(g.id)}
                                                className={`flex items-center justify-between p-2 rounded-xl cursor-pointer transition ${
                                                    g.checked ? 'opacity-40 bg-white/5' : 'hover:bg-white/5'
                                                }`}
                                            >
                                                <div className="flex items-center gap-2.5">
                                                    <div className={`w-4 h-4 rounded border flex items-center justify-center ${
                                                        g.checked ? 'bg-neonGreen border-neonGreen text-slate-950' : 'border-white/30'
                                                    }`}>
                                                        {g.checked && <i data-lucide="check" className="w-3 h-3 stroke-[3]"></i>}
                                                    </div>
                                                    <span className={`text-xs ${g.checked ? 'line-through text-gray-400' : 'text-gray-200'}`}>
                                                        {g.item}
                                                    </span>
                                                </div>
                                                <span className="text-[10px] text-gray-400 bg-white/5 px-2 py-0.5 rounded">{g.qty}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // 5. SETTINGS VIEW (Preferences, Privacy, Disclaimers, Delete Account)
        function SettingsView({ dietaryPrefs, setDietaryPrefs, onShowOnboarding }) {
            const [showConfirmDelete, setShowConfirmDelete] = useState(false);
            const [deleted, setDeleted] = useState(false);

            const togglePref = (key) => {
                setDietaryPrefs({ ...dietaryPrefs, [key]: !dietaryPrefs[key] });
            };

            return (
                <div className="space-y-5 animate-fadeIn">
                    <div>
                        <h2 className="text-lg font-bold text-white">App Settings</h2>
                        <p className="text-xs text-gray-400">Dietary preferences, disclaimers & privacy controls</p>
                    </div>

                    {/* Dietary Preferences Section */}
                    <div className="glass-panel p-4 rounded-2xl space-y-3">
                        <div className="flex justify-between items-center">
                            <h3 className="text-xs font-bold text-gray-300 uppercase tracking-wider">Dietary Preferences</h3>
                            <button onClick={onShowOnboarding} className="text-[11px] text-neonCyan underline">Setup Wizard</button>
                        </div>

                        <div className="grid grid-cols-2 gap-2 text-xs">
                            {Object.keys(dietaryPrefs).map((key) => (
                                <button 
                                    key={key}
                                    onClick={() => togglePref(key)}
                                    className={`p-2.5 rounded-xl border text-left font-medium transition flex justify-between items-center ${
                                        dietaryPrefs[key]
                                            ? 'bg-neonCyan/15 border-neonCyan/40 text-cyan-200'
                                            : 'bg-white/5 border-white/10 text-gray-400'
                                    }`}
                                >
                                    <span className="capitalize">{key.replace(/([AZ])/g, ' $1')}</span>
                                    {dietaryPrefs[key] && <i data-lucide="check" className="w-3.5 h-3.5 text-neonCyan"></i>}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Safety, Privacy & Disclaimers */}
                    <div className="glass-panel p-4 rounded-2xl space-y-3 text-xs text-gray-300">
                        <h3 className="font-bold text-gray-200 uppercase tracking-wider text-[11px]">Safety & Privacy Information</h3>
                        <p className="leading-relaxed">
                            <strong className="text-white">Estimates Disclaimer:</strong> Photo scan and food log nutrition values are powered by computer vision algorithms and are only estimates. Do not use for medical diagnosis or strict allergy management.
                        </p>
                        <p className="leading-relaxed">
                            <strong className="text-white">Allergy Safety:</strong> Always manually confirm ingredients and food packaging before consumption.
                        </p>
                    </div>

                    {/* Account & Data Management */}
                    <div className="glass-panel p-4 rounded-2xl space-y-3">
                        <h3 className="text-xs font-bold text-red-400 uppercase tracking-wider">Account & Data Removal</h3>
                        <p className="text-xs text-gray-400">Permanently remove all logged meals, photos, and personal data from this device.</p>
                        
                        {!deleted ? (
                            <button 
                                onClick={() => setShowConfirmDelete(true)}
                                className="w-full py-2.5 rounded-xl bg-red-500/15 border border-red-500/30 text-red-400 font-bold text-xs hover:bg-red-500/25 transition"
                            >
                                Delete Account & Wipe Local Data
                            </button>
                        ) : (
                            <div className="p-3 bg-red-500/20 border border-red-500/40 rounded-xl text-red-300 text-xs font-medium text-center">
                                Account and local data have been successfully deleted.
                            </div>
                        )}
                    </div>

                    {/* Confirmation Modal */}
                    {showConfirmDelete && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-panel-glow p-5 rounded-3xl max-w-xs w-full space-y-4 text-center">
                                <i data-lucide="alert-triangle" className="w-10 h-10 text-red-400 mx-auto"></i>
                                <h3 className="font-bold text-white text-base">Delete Account?</h3>
                                <p className="text-xs text-gray-300">This action cannot be undone. All saved meals and preferences will be permanently cleared.</p>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setShowConfirmDelete(false)}
                                        className="flex-1 py-2 rounded-xl bg-white/10 text-gray-300 text-xs font-bold"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => {
                                            setDeleted(true);
                                            setShowConfirmDelete(false);
                                        }}
                                        className="flex-1 py-2 rounded-xl bg-red-500 text-white text-xs font-bold"
                                    >
                                        Yes, Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- MODAL DIALOGS --- //

        // Onboarding Modal
        function OnboardingModal({ dietaryPrefs, setDietaryPrefs, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fadeIn">
                    <div className="glass-panel-glow p-6 rounded-3xl max-w-sm w-full space-y-5 relative">
                        <div className="text-center space-y-1">
                            <span className="text-3xl">🔥</span>
                            <h2 className="text-xl font-extrabold text-white">Welcome to PrepMaster PRO</h2>
                            <p className="text-xs text-gray-400">Select your dietary preferences to personalize your meal log.</p>
                        </div>

                        <div className="space-y-2 max-h-48 overflow-y-auto">
                            {Object.keys(dietaryPrefs).map((key) => (
                                <button 
                                    key={key}
                                    onClick={() => setDietaryPrefs({ ...dietaryPrefs, [key]: !dietaryPrefs[key] })}
                                    className={`w-full p-2.5 rounded-xl border text-left text-xs font-medium transition flex justify-between items-center ${
                                        dietaryPrefs[key] 
                                            ? 'bg-neonCyan/20 border-neonCyan/50 text-cyan-200' 
                                            : 'bg-white/5 border-white/10 text-gray-400'
                                    }`}
                                >
                                    <span className="capitalize">{key.replace(/([AZ])/g, ' $1')}</span>
                                    {dietaryPrefs[key] && <i data-lucide="check" className="w-4 h-4 text-neonCyan"></i>}
                                </button>
                            ))}
                        </div>

                        <div className="space-y-2 pt-2">
                            <button 
                                onClick={onClose}
                                className="w-full py-3 rounded-xl bg-gradient-to-r from-neonCyan to-emerald-400 text-slate-950 font-bold text-xs shadow-lg shadow-cyan-500/20"
                            >
                                Continue to Dashboard
                            </button>
                            <button 
                                onClick={onClose}
                                className="w-full py-2 text-center text-xs text-gray-400 hover:text-white"
                            >
                                Skip for now
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Manual Add Meal Modal
        function ManualAddMealModal({ data, setData, onClose, onSubmit }) {
            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fadeIn">
                    <div className="glass-panel-glow p-5 rounded-3xl max-w-xs w-full space-y-4">
                        <div className="flex justify-between items-center border-b border-white/10 pb-2">
                            <h3 className="font-bold text-white text-sm">Add Meal Manually</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-white"><i data-lucide="x" className="w-4 h-4"></i></button>
                        </div>

                        <form onSubmit={onSubmit} className="space-y-3 text-xs">
                            <div>
                                <label className="block text-gray-400 mb-1">Meal Title</label>
                                <input 
                                    type="text" 
                                    required 
                                    placeholder="e.g. Avocado Toast" 
                                    value={data.title}
                                    onChange={(e) => setData({ ...data, title: e.target.value })}
                                    className="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-neonGreen"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="block text-gray-400 mb-1">Meal Type</label>
                                    <select 
                                        value={data.type}
                                        onChange={(e) => setData({ ...data, type: e.target.value })}
                                        className="w-full bg-slate-900 border border-white/10 rounded-xl px-2 py-2 text-white focus:outline-none"
                                    >
                                        <option value="Breakfast">Breakfast</option>
                                        <option value="Lunch">Lunch</option>
                                        <option value="Dinner">Dinner</option>
                                        <option value="Snack">Snack</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-gray-400 mb-1">Calories (Est)</label>
                                    <input 
                                        type="number" 
                                        placeholder="400" 
                                        value={data.calories}
                                        onChange={(e) => setData({ ...data, calories: e.target.value })}
                                        className="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-neonGreen"
                                    />
                                </div>
                            </div>

                            <button type="submit" className="w-full py-2.5 rounded-xl bg-neonGreen text-slate-950 font-bold text-xs mt-2">
                                Save Meal
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
